name: Go

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOPRIVATE: github.com/go-cnfg/*

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.list.outputs.mods }}
      changed: ${{ steps.changed.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: list
        run: |
          mods=(cnfg)
          for d in */; do
            d=${d%/}
            if [ "$d" != "internal" ] && [ -f "$d/go.mod" ]; then
              mods+=("$d")
            fi
          done
          echo "mods=$(printf '%s\n' "${mods[@]}" | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"

      - id: changed
        run: |
          changed=()
          for m in $(echo '${{ steps.list.outputs.mods }}' | jq -r '.[]'); do
            if [ "$m" = "cnfg" ]; then
              last=$(git tag --list 'v*' | grep -E '^v[0-9]' | sort -V | tail -1)
              paths=(. ':!internal' ':!.github')
              for d in */; do
                d=${d%/}
                if [ -f "$d/go.mod" ]; then
                  paths+=(":!$d")
                fi
              done
            else
              last=$(git tag --list "$m/v*" | grep -E "^$m/v[0-9]" | sort -V | tail -1)
              paths=("$m/")
            fi
            if [ -z "$last" ] || ! git diff --quiet "$last"..HEAD -- "${paths[@]}"; then
              changed+=("$m")
            fi
          done
          if [ ${#changed[@]} -eq 0 ]; then
            echo "mods=[]" >> "$GITHUB_OUTPUT"
          else
            echo "mods=$(printf '%s\n' "${changed[@]}" | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./internal/tools/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Tidy check
        run: make tidy-check/${{ matrix.mod }}

      - name: Lint
        run: make lint/${{ matrix.mod }}

      - name: API check
        run: make api-check/${{ matrix.mod }}

      - name: Test
        run: make test/${{ matrix.mod }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./.output/coverage/${{ matrix.mod }}.txt
          flags: ${{ matrix.mod }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./.output/junit/${{ matrix.mod }}.xml
          flags: ${{ matrix.mod }}

  tag:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover.outputs.changed != '[]' }}
    needs:
      - discover
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.changed) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: ./internal/tools/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Tag
        run: make tag/${{ matrix.mod }}

      - id: name
        name: Resolve tag name
        run: |
          prefix=""
          if [ "${{ matrix.mod }}" != "cnfg" ]; then
            prefix="${{ matrix.mod }}/"
          fi
          echo "name=$(git tag --points-at HEAD --list "$prefix"'v*' | grep -E "^$prefix"'v[0-9]' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          tag="${{ steps.name.outputs.name }}"
          if [ -n "$tag" ] && ! git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            git push origin "$tag"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.name.outputs.name }}"
          if [ -n "$tag" ]; then
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes
          fi

  ci:
    needs:
      - discover
      - test
      - tag
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        run: |
          [ "${{ needs.discover.result }}" = "success" ] || exit 1
          case "${{ needs.test.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.tag.result }}"  in success|skipped) ;; *) exit 1 ;; esac
