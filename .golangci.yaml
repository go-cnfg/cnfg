version: "2"
linters:
  default: fast
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - govet
    - gosec
    - iface
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
  disable:
    - depguard
    - wsl
    - nlreturn
    - mnd
    - nosprintfhostport
    - inamedparam
    - godot
    - funlen
    - lll
  settings:
    gomoddirectives:
      replace-local: true
  exclusions:
    presets:
      - common-false-positives
formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
